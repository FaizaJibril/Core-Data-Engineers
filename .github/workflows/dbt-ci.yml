name: dbt CI (marketing platform)

on:
  pull_request:
    branches: [main]
    paths:
      - "DBT/marketing-data-platform/**"
      - ".github/workflows/dbt-*.yml"

concurrency:
  group: dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DBT/marketing-data-platform/marketing_platform
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DBT_CI_SCHEMA: ci_pr_${{ github.event.pull_request.number }}
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install -r ../requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Build and test in CI catalog
        run: dbt build --target ci

      - name: Generate docs
        run: dbt docs generate --target ci --static

      - name: Elementary report
        if: always()   # most useful exactly when the build failed
        run: edr report --profiles-dir . --project-dir . --profile-target ci --file-path elementary_report.html --open-browser false

      - name: Upload docs and Elementary report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-docs-and-elementary
          path: |
            DBT/marketing-data-platform/marketing_platform/target/static_index.html
            DBT/marketing-data-platform/marketing_platform/elementary_report.html

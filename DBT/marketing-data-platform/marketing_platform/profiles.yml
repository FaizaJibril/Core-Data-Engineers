marketing_platform:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: dev
      schema: dbt_faiza
      threads: 4

    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: ci_development
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci') }}"
      threads: 4

    # Runs as the Service Principal. Free Edition refuses OAuth M2M scopes, so this uses a
    # token owned by the Service Principal (see NOTES.md). On a paid workspace, replace the
    # token line with: auth_type: oauth, client_id and client_secret from env vars.
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_SP_TOKEN') }}"
      catalog: production
      schema: analytics
      threads: 4

# Used by the Elementary CLI (edr report) to read test results and run history.
# Points at the schema where the elementary package writes, per environment
# (named by macros/generate_schema_name.sql).
elementary:
  target: dev
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: dev
      schema: dbt_faiza_elementary
      threads: 4

    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: ci_development
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci') }}_elementary"
      threads: 4

    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_SP_TOKEN') }}"
      catalog: production
      schema: elementary
      threads: 4

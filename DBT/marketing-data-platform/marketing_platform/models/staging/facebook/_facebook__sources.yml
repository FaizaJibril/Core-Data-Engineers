version: 2

sources:
  - name: facebook_ads
    description: "Raw Facebook Ads exports loaded as-is (all columns strings) into bronze. One table per export file."
    database: bronze_production
    schema: facebook_ads
    tables:
      - name: ads_stats
        description: "Daily ad performance. Grain: one row per ad_id per ad_date."
        columns:
          - name: ad_id
            description: "Facebook ad identifier (numeric, stored as string)."
          - name: ad_spend
            description: "Spend in the account's currency (see accounts.ad_currency_code)."
          - name: ad_clicks
            description: "Clicks. Literal string 'null' when Facebook reported no value."
      - name: ads
        description: "Ad attributes; links ad_id to campaign_id, ad_group_id and account_id."
      - name: campaigns
        description: "Campaign names. One row per campaign_id."
      - name: ad_groups
        description: "Ad group (ad set) names. One row per ad_group_id."
      - name: accounts
        description: "Ad accounts, including the currency spend is reported in."
